<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Skimgram - surprisal-based skim reading for the web">
  <title>Skimgram - surprisal-based skim reading for the web</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252932"/>
      <stop offset="1" stop-color="#131519"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#FF6A3D" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF6A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#FF4740" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF4740" stop-opacity="0"/>
    </radialGradient>
    <filter id="shotShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="shotClip">
      <rect x="584" y="159" width="624" height="322.40" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="180" cy="70" rx="440" ry="300" fill="url(#glowA)"/>
  <ellipse cx="1140" cy="610" rx="420" ry="300" fill="url(#glowB)"/>

  <rect x="72" y="56" width="485" height="30" rx="15" fill="#FF6A3D" fill-opacity="0.16" stroke="#FF8F66" stroke-opacity="0.38"/>
  <text x="88" y="75.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" letter-spacing="1.7" fill="#FF9E7A">CHROME EXTENSION · MANIFEST V3 · TAMPERMONKEY</text>

  <text x="72" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-0.5" fill="#F2F4F8">Skimgram</text>
  <text x="72" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#9AA3B2">Surprisal-based skim reading for the web.</text>
  <text x="72" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#9AA3B2">It fades the words your brain already predicted.</text>

  <text x="72" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="2.2" fill="#8B93A6">OFFLINE BY DESIGN · NO MODEL DOWNLOAD</text>

  <rect x="72" y="289" width="26" height="26" rx="8" fill="#FF6A3D" fill-opacity="0.20" stroke="#FF8F66" stroke-opacity="0.42"/>
    <g transform="translate(76.00 293.00) scale(0.75)" fill="none" stroke="#FF8F66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 0 4 4 4 4 0 0 0 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g>
    <text x="112" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F2F4F8">Two passes, page-local</text>
    <text x="112" y="327" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#9AA3B2">Fits an n-gram model on the page, then scores it</text>
  <rect x="72" y="336" width="26" height="26" rx="8" fill="#FF6A3D" fill-opacity="0.20" stroke="#FF8F66" stroke-opacity="0.42"/>
    <g transform="translate(76.00 340.00) scale(0.75)" fill="none" stroke="#FF8F66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g>
    <text x="112" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F2F4F8">60 ms per 40,000 words</text>
    <text x="112" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#9AA3B2">No model download, no warm-up, no GPU</text>
  <rect x="72" y="383" width="26" height="26" rx="8" fill="#FF6A3D" fill-opacity="0.20" stroke="#FF8F66" stroke-opacity="0.42"/>
    <g transform="translate(76.00 387.00) scale(0.75)" fill="none" stroke="#FF8F66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
    <text x="112" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F2F4F8">Fully offline</text>
    <text x="112" y="421" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#9AA3B2">Zero network requests, zero telemetry, no account</text>
  <rect x="72" y="430" width="26" height="26" rx="8" fill="#FF6A3D" fill-opacity="0.20" stroke="#FF8F66" stroke-opacity="0.42"/>
    <g transform="translate(76.00 434.00) scale(0.75)" fill="none" stroke="#FF8F66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L3 8"/></g>
    <text x="112" y="449" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F2F4F8">Lossless toggle</text>
    <text x="112" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#9AA3B2">Turning it off restores byte-identical HTML</text>
  <rect x="72" y="477" width="26" height="26" rx="8" fill="#FF6A3D" fill-opacity="0.20" stroke="#FF8F66" stroke-opacity="0.42"/>
    <g transform="translate(76.00 481.00) scale(0.75)" fill="none" stroke="#FF8F66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
    <text x="112" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F2F4F8">Any language</text>
    <text x="112" y="515" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#9AA3B2">Latin, Cyrillic, Arabic, Devanagari, CJK per character</text>

  <text x="72" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#6E7787">github.com/awesomedog/skimgram · MIT licence</text>

