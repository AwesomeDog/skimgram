<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    The idle state: every line reads the same, because nothing has been marked
    yet. `icon-on.svg` is this same page with the fourth line turned orange —
    that accent is the reading view, and it is the only difference between the
    two states, which is what makes it legible at 16 px.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252932" />
      <stop offset="1" stop-color="#131519" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <g fill="#e7e9ee">
    <rect x="24" y="30" width="54" height="11" rx="5.5" opacity=".26" />
    <rect x="24" y="51" width="80" height="11" rx="5.5" opacity=".26" />
    <rect x="24" y="72" width="66" height="11" rx="5.5" opacity=".26" />
    <rect x="24" y="93" width="42" height="11" rx="5.5" opacity=".26" />
  </g>
</svg>
