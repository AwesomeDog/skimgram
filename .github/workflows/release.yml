name: Release userscript

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The userscript header takes @version from package.json, so a tag that
      # does not match it would ship a script that never reports an update.
      - name: Check version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - name: Build userscript
        run: |
          npm ci
          npm run build:userscript

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: .output/userscript/skimgram.user.js

      # Draft on purpose: CI builds and attests, a human publishes. The
      # userscript's @updateURL reads releases/latest/download/, so it starts
      # serving the new version when the draft is published, not at tag time.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft \
            .output/userscript/skimgram.user.js
